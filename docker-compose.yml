name: intervu-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: intervu
      POSTGRES_USER: intervu
      POSTGRES_PASSWORD: intervu
    ports:
      - "5432:5432"
    volumes:
      - intervu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervu -d intervu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - intervu_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://intervu:intervu@postgres:5432/intervu
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - intervu_api_venv:/app/.venv
      - intervu_uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "uv sync --all-extras && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  worker:
    build:
      context: ./apps/api
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://intervu:intervu@postgres:5432/intervu
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
      - intervu_worker_venv:/app/.venv
      - intervu_uploads:/app/.data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "uv sync --all-extras && uv run arq app.workers.settings.WorkerSettings"]

volumes:
  intervu_postgres:
  intervu_redis:
  intervu_uploads:
  intervu_api_venv:
  intervu_worker_venv:
