[project]
name = "intervu-api"
version = "0.1.0"
description = "Production API and AI orchestration layer for Intervu AI"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16.4,<2",
  "arq>=0.26.3,<1",
  "asyncpg>=0.30.0,<1",
  "cryptography>=45.0.6,<46",
  "fastapi>=0.116.1,<1",
  "firebase-admin>=7.1.0,<8",
  "google-api-python-client>=2.179.0,<3",
  "google-auth>=2.40.3,<3",
  "google-auth-oauthlib>=1.2.2,<2",
  "httpx>=0.28.1,<1",
  "itsdangerous>=2.2.0,<3",
  "orjson>=3.11.2,<4",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "pydantic-extra-types>=2.10.5,<3",
  "pypdf>=5.9.0,<6",
  "python-docx>=1.2.0,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.3.1,<6",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4.0,<26",
  "tenacity>=9.1.2,<10",
  "uvicorn[standard]>=0.35.0,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21.0,<1",
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.9,<1",
  "types-python-dateutil>=2.9.0.20250809"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
